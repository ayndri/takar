
# Postgres lokal untuk ngoding tanpa internet / tanpa kena cold start Neon.
# Pakai dengan mengarahkan DATABASE_URL & DIRECT_URL di apps/api/.env ke:
#   postgresql://takar:takar@localhost:5432/takar?schema=public
#
#   docker compose up -d
#   npm run db:migrate
#   npm run db:seed

services:
  db:
    image: postgres:18-alpine
    container_name: takar-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: takar
      POSTGRES_PASSWORD: takar
      POSTGRES_DB: takar
    ports:
      - '5432:5432'
    volumes:
      - takar-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U takar -d takar']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  takar-db-data:
